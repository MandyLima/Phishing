<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Principia</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-container">
        <!-- Título Superior -->
        <h2>Já tem conta?</h2>

        <!-- Botão Google -->
        <button type="button" class="btn-google">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue com Google
        </button>

        <hr class="divider-line">

        <!-- Formulário Principal -->
        <form action="/post" method="POST">
            <label class="field-label">Ou insira seu e-mail</label>
            <input type="email" name="email" class="input-field" required autocomplete="email">

            <label class="field-label">E digite sua senha</label>
            <div class="password-group">
                <input type="password" name="senha" class="input-field input-password" required autocomplete="current-password">
                <button type="button" class="btn-toggle-eye" title="Mostrar/ocultar senha">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <button type="submit" class="btn-submit">ENTRAR</button>
            </div>
        </form>

        <p class="forgot-password">
            Esqueceu a sua senha? <a href="#">CLIQUE AQUI</a> para receber uma nova
        </p>

        <hr class="divider-line">

        <!-- Seção Criar Conta -->
        <h2>Ainda não tem uma?</h2>
        <button type="button" class="btn-create-account" onclick="window.location.href='/'">CRIE SUA CONTA</button>
    </main>

</body>
</html>
